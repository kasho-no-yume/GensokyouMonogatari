<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>符卡预览 · Gensokyou</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff86c8'/%3E%3C/svg%3E">
<style>
  :root { --ink: #e8ecff; --dim: #8b93b8; --panel: rgba(14,17,28,.82); --accent: #ff86c8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d16; color: var(--ink);
               font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid rgba(120,140,200,.22);
           border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #top { top: 12px; left: 12px; min-width: 320px; }
  #top select { width: 100%; margin-top: 6px; background: #131828; color: var(--ink);
                border: 1px solid rgba(120,140,200,.3); border-radius: 6px; padding: 6px 8px; }
  #title { font-size: 15px; font-weight: 600; }
  #meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #cams { top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
  #cams button { background: #131828; color: var(--ink); border: 1px solid rgba(120,140,200,.3);
                 border-radius: 6px; padding: 5px 10px; cursor: pointer; text-align: left; }
  #cams button:hover { border-color: var(--accent); }
  #bottom { left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; }
  #play { width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(120,140,200,.35);
          background: #1a2033; color: var(--ink); cursor: pointer; font-size: 14px; }
  #track { position: relative; flex: 1; height: 34px; display: flex; align-items: center; }
  #density { position: absolute; left: 8px; right: 8px; top: 4px; height: 26px; width: calc(100% - 16px);
             pointer-events: none; opacity: .85; }
  #playhead { position: absolute; top: 3px; height: 28px; width: 2px; background: var(--accent);
              box-shadow: 0 0 6px var(--accent); pointer-events: none; transform: translateX(-1px); }
  #range { position: relative; flex: 1; accent-color: var(--accent); background: transparent; }
  #tick { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 118px; text-align: right; }
  #alive { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 132px; text-align: right; }
  #alive b { color: var(--accent); font-weight: 600; }
  #speed, #loopLabel { background: #131828; color: var(--ink); border: 1px solid rgba(120,140,200,.3);
                       border-radius: 6px; padding: 4px 6px; }
  #note { right: 12px; bottom: 62px; max-width: 330px; color: var(--dim); font-size: 11.5px; line-height: 1.55; }
  #note b { color: #ffb3d6; font-weight: 600; }
  #error { display: none; top: 50%; left: 50%; transform: translate(-50%,-50%); max-width: 560px; }
  #error code { color: #9fe6ff; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="top" class="panel">
  <div id="title">符卡预览</div>
  <div id="meta">加载中…</div>
  <select id="card-select"></select>
</div>

<div id="cams" class="panel">
  <button data-preset="eyes">① 玩家眼位</button>
  <button data-preset="top">② 正俯视</button>
  <button data-preset="side">③ 侧视</button>
  <button data-preset="boss">④ BOSS 后方</button>
</div>

<div id="bottom" class="panel">
  <button id="play" title="空格">❚❚</button>
  <div id="track">
    <canvas id="density"></canvas>
    <div id="playhead"></div>
    <input id="range" type="range" min="0" max="100" value="0" step="0.25">
  </div>
  <span id="tick">0 / 0</span>
  <span id="alive">存活 <b>0</b> · 峰值 0</span>
  <select id="speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
  </select>
  <label id="loopLabel"><input id="loop" type="checkbox" checked> 循环</label>
</div>

<div id="note" class="panel">
  <b>这是投影预览，不是躲避训练器。</b>没有碰撞与命中判定；BOSS 与目标都是静止的，
  所以 aimed 弹会全部收束到木桩一点，看起来比实机更密——<b>不要拿它判断难度</b>。
  位置、明暗、粗细全部来自真实 runtime 导出的客户端渲染投影。
</div>

<div id="error" class="panel"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
